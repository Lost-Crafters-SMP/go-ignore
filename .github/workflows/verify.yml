name: Extended verification

# Long-running verification that should not gate routine changes: nightly deep
# fuzzing of every target and weekly dataset-dependent comparative correctness.
# Manually dispatchable. Deliberately outside CI's concurrency group so a
# routine run can never cancel or be cancelled by these.
on:
  schedule:
    # Nightly deep fuzz (02:30 UTC).
    - cron: "30 2 * * *"
    # Weekly comparative correctness (Sundays 04:00 UTC).
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Deep fuzz exploration of every target in the module. Routine CI fuzzes
  # only the two established targets with a small smoke budget; this job
  # carries the full budget and the three targets routine CI never fuzzes.
  fuzz:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fuzz parser ownership
        run: go test . -run '^$' -fuzz '^FuzzParserOwnership$' -fuzztime=1000000x -parallel=4 -timeout=900s
      - name: Fuzz pattern equivalence
        run: go test . -run '^$' -fuzz '^FuzzPatternEquivalence$' -fuzztime=1000000x -parallel=4 -timeout=900s
      - name: Fuzz winner index equivalence
        run: go test . -run '^$' -fuzz '^FuzzWinnerIndexEquivalence$' -fuzztime=1000000x -parallel=4 -timeout=900s
      - name: Fuzz policy composition
        run: go test . -run '^$' -fuzz '^FuzzPolicyComposition$' -fuzztime=1000000x -parallel=4 -timeout=900s
      - name: Fuzz arbitrary compile
        run: go test . -run '^$' -fuzz '^FuzzCompileArbitrary$' -fuzztime=1000000x -parallel=4 -timeout=900s

  # Comparative correctness against the pinned competitor libraries on the
  # materialised datasets (bench/README.md documents reproduction). Advisory:
  # not a required check, and deliberately free of performance thresholds or
  # regression decisions. The dataset cache avoids re-downloading the pinned
  # moby checkout (~40 MB) and rebuilding datasets when the deterministic
  # generators are unchanged; correctness itself always re-executes.
  bench-correctness:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - name: Cache benchmark datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-ignore-bench
          key: benchdata-v1-${{ hashFiles('bench/internal/dataset/**') }}
      - name: Materialise benchmark datasets
        working-directory: bench
        run: go run ./cmd/benchsetup
      - name: Comparative correctness
        working-directory: bench
        run: go test . -run 'TestCorrectness|TestPairEquivalence|TestRankAndReservedEquivalence|TestWalkerEquivalence' -count=1 -v -timeout=600s
